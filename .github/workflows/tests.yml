name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        include:
          # Laravel 10 and 11 no longer get security fixes, so every release
          # carries open advisories and Composer refuses to install them.
          # Allow it here only to keep testing compatibility; nothing ships.
          - laravel: '10.*'
            testbench: '8.*'
            phpunit: '^10.5'
            allow-insecure: true
          - laravel: '11.*'
            testbench: '9.*'
            allow-insecure: true
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / SQLite

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.allow-insecure }}" = "true" ]; then composer config policy.advisories.block false; fi
          composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" ${{ matrix.phpunit && format('"phpunit/phpunit:{0}"', matrix.phpunit) || '' }} --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  mysql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '10.*'
            testbench: '8.*'
            phpunit: '^10.5'
            allow-insecure: true
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP 8.3 / Laravel ${{ matrix.laravel }} / MySQL 5.7

    # MySQL 5.7 defaults to explicit_defaults_for_timestamp=OFF with strict
    # mode, like many shared hosts; it is where schema mistakes show up.
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.allow-insecure }}" = "true" ]; then composer config policy.advisories.block false; fi
          composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" ${{ matrix.phpunit && format('"phpunit/phpunit:{0}"', matrix.phpunit) || '' }} --dev --no-update --no-interaction
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          TEST_DB: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: testing
